<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>王炸 · Jokers Wild</title>
<style>
  :root { --ink: #0d0b0a; --paper: #efe6d2; --amber: #ffb340; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: Georgia, "Times New Roman", serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #frame { position: relative; aspect-ratio: 1920 / 1080; width: min(100vw, calc(100vh * 1920 / 1080)); }
  #film, #titles { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #titles { pointer-events: none; }
  #ui { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0.35), rgba(0,0,0,0.8)); transition: opacity .4s; }
  #ui.hidden { opacity: 0; pointer-events: none; }
  #ui h1 { margin: 0; color: var(--paper); font-family: "Songti SC", "SimSun", serif; font-size: clamp(48px, 9vw, 140px); letter-spacing: .15em; line-height: 1; }
  #ui p { margin: 0; color: #d8cdb6; font-size: clamp(13px, 1.3vw, 18px); letter-spacing: .3em; }
  #play { font: inherit; font-size: clamp(16px, 1.6vw, 22px); padding: .6em 1.6em; border-radius: 2px; border: 1px solid var(--amber);
          background: transparent; color: var(--amber); cursor: pointer; letter-spacing: .2em; }
  #play:disabled { opacity: .5; }
  #msg { min-height: 1.2em; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; cursor: pointer; opacity: 0; transition: opacity .3s; }
  #frame:hover #bar { opacity: 1; }
  #bar::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.2); }
  #fill { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--amber); width: 0; }
  #help { position: fixed; right: 12px; bottom: 8px; color: rgba(255,255,255,.3); font: 11px system-ui, sans-serif; }
</style>
</head>
<body>
<div id="stage"><div id="frame">
  <canvas id="film"></canvas>
  <canvas id="titles"></canvas>
  <div id="ui">
    <h1>王炸</h1>
    <p>JOKERS WILD</p>
    <button id="play">▶ PLAY</button>
    <p id="msg"></p>
  </div>
  <div id="bar"><div id="fill"></div></div>
</div></div>
<div id="help">space play/pause · ← → seek · R restart · F fullscreen</div>
<script>/*BUNDLE*/</script>
</body>
</html>
